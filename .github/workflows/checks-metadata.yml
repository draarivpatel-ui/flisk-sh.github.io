name: Cilytics metadata

on:
  pull_request:
    paths:
      - "checks/index.html"
      - "scripts/cilytics/metadata.test.mjs"
      - ".github/workflows/checks-metadata.yml"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.5
      - run: node --test scripts/cilytics/metadata.test.mjs
